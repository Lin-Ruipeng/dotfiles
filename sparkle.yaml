# Gemini 专属分流：从 openAI 组摘出来，单独走 🔰 节点选择
# 说明：+rules 为「前置插入」，会排在订阅自带规则之前，因此优先生效。
# 注意：不要用 prepend-rules（mihomo 与 Sparkle 都不识别该键，会被静默忽略）。
+rules:
  - DOMAIN-SUFFIX,gemini.google.com,🔰 节点选择
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,🔰 节点选择
  - DOMAIN-SUFFIX,aida.googleapis.com,🔰 节点选择
  - DOMAIN-SUFFIX,ai.google.dev,🔰 节点选择
