prepend-rules:
  # ===================================================
  # 1. 远程控制防断连（最高优先级，优先放行本地真实网络）
  # ===================================================
  - PROCESS-NAME,UURemote.exe,DIRECT
  - PROCESS-NAME,uuycmgr.exe,DIRECT
  - PROCESS-NAME,GameViewer.exe,DIRECT 
  
  # ===================================================
  # 2. 接管 Codex 独立客户端
  # ===================================================
  - PROCESS-NAME,codex.exe,openAI

  # ===================================================
  # 3. 禁用 QUIC (HTTP/3)，强制后续流量使用更稳定的 TCP 代理
  # ===================================================
  - UDP-PORT,443,REJECT
  
  # ===================================================
  # 4. Gemini 专属服务域名
  # ===================================================
  - DOMAIN-SUFFIX,gemini.google.com,openAI
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,openAI
  - DOMAIN-SUFFIX,ai.google.dev,openAI
  
  # ===================================================
  # 5. Google 搜索及周边底层依赖资源
  # ===================================================
  - DOMAIN-SUFFIX,google.com,openAI
  - DOMAIN-SUFFIX,googleapis.com,openAI
  - DOMAIN-SUFFIX,gstatic.com,openAI
  - DOMAIN-SUFFIX,googleusercontent.com,openAI
  
  # ===================================================
  # 6. 兜底规则
  # ===================================================
  - DOMAIN-KEYWORD,google,openAI
  